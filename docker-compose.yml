services:
  baostock-runner:
    build:
      context: .
      args:
        HTTP_PROXY: ${BAOSTOCK_BUILD_HTTP_PROXY}
        HTTPS_PROXY: ${BAOSTOCK_BUILD_HTTPS_PROXY}
        NO_PROXY: ${BAOSTOCK_BUILD_NO_PROXY}
    image: ghcr.io/nickshee/baostock-runner:latest
    container_name: baostock-runner
    restart: unless-stopped
    ports:
      - "8002:8000"
    volumes:
      - ${BAOSTOCK_HOST_DATA_DIR}:/data
    networks:
      - lobehub_lobe-net
    environment:
      BAOSTOCK_DB_PATH: /data/baostock.sqlite3
      BAOSTOCK_LOG_PATH: /data/baostock-audit.jsonl
      BAOSTOCK_USER_ID: ${BAOSTOCK_USER_ID}
      BAOSTOCK_PASSWORD: ${BAOSTOCK_PASSWORD}
      BAOSTOCK_MCP_TRANSPORT: streamable-http
      BAOSTOCK_MCP_HOST: 0.0.0.0
      BAOSTOCK_MCP_PORT: "8000"
      BAOSTOCK_MCP_PATH: /mcp
      # True = stateless Streamable HTTP. Avoids "Session not found" 404 disconnects
      # when the client reconnects after the stateful session idle timeout.
      BAOSTOCK_MCP_STATELESS: ${BAOSTOCK_MCP_STATELESS:-true}
      BAOSTOCK_MIN_INTERVAL_SECONDS: "1.0"
      BAOSTOCK_DAILY_WARNING_LIMIT: "10000"
      BAOSTOCK_DAILY_HARD_LIMIT: "20000"
      BAOSTOCK_MAX_RETRIES: "2"
      BAOSTOCK_RETRY_DELAYS_SECONDS: "5,30,120"
      # Session keepalive / reconnect
      BAOSTOCK_SESSION_IDLE_TIMEOUT_SECONDS: ${BAOSTOCK_SESSION_IDLE_TIMEOUT_SECONDS:-1800}
      BAOSTOCK_RECONNECT_ON_FAILURE: ${BAOSTOCK_RECONNECT_ON_FAILURE:-true}
      BAOSTOCK_VERIFY_AFTER_LOGIN: ${BAOSTOCK_VERIFY_AFTER_LOGIN:-true}
      # Background fetcher (P1): batch download to local SQLite
      BAOSTOCK_FETCH_ENABLED: ${BAOSTOCK_FETCH_ENABLED:-true}
      BAOSTOCK_FETCH_UNIVERSE: ${BAOSTOCK_FETCH_UNIVERSE:-hs300}
      BAOSTOCK_FETCH_BUDGET_RATIO: ${BAOSTOCK_FETCH_BUDGET_RATIO:-0.67}
      BAOSTOCK_FETCH_BATCH_SIZE: ${BAOSTOCK_FETCH_BATCH_SIZE:-50}
      BAOSTOCK_FETCH_DAILY_START_DATE: ${BAOSTOCK_FETCH_DAILY_START_DATE:-2018-01-01}
      BAOSTOCK_FETCH_FINANCIAL_START_YEAR: ${BAOSTOCK_FETCH_FINANCIAL_START_YEAR:-2022}
      BAOSTOCK_FETCH_FINANCIAL_DATASETS: ${BAOSTOCK_FETCH_FINANCIAL_DATASETS:-profit}
      BAOSTOCK_FETCH_ADJUSTFLAGS: ${BAOSTOCK_FETCH_ADJUSTFLAGS:-3}
      BAOSTOCK_FETCH_INCLUDE_DIVIDENDS: ${BAOSTOCK_FETCH_INCLUDE_DIVIDENDS:-false}
      BAOSTOCK_FETCH_INCLUDE_ADJUST_FACTORS: ${BAOSTOCK_FETCH_INCLUDE_ADJUST_FACTORS:-false}
      BAOSTOCK_FETCH_IDLE_SLEEP_SECONDS: ${BAOSTOCK_FETCH_IDLE_SLEEP_SECONDS:-300}
      BAOSTOCK_FETCH_PAUSE_SLEEP_SECONDS: ${BAOSTOCK_FETCH_PAUSE_SLEEP_SECONDS:-600}
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 8000), 3); s.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
networks:
  lobehub_lobe-net:
    external: true
