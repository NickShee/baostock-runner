services:
  baostock-runner:
    build:
      context: .
      args:
        HTTP_PROXY: ${BAOSTOCK_BUILD_HTTP_PROXY}
        HTTPS_PROXY: ${BAOSTOCK_BUILD_HTTPS_PROXY}
        NO_PROXY: ${BAOSTOCK_BUILD_NO_PROXY}
    image: ghcr.io/nickshee/baostock-runner:latest
    container_name: baostock-runner
    restart: unless-stopped
    ports:
      - "8002:8000"
    volumes:
      - ${BAOSTOCK_HOST_DATA_DIR}:/data
    networks:
      - lobehub_lobe-net
    environment:
      BAOSTOCK_DB_PATH: /data/baostock.sqlite3
      BAOSTOCK_LOG_PATH: /data/baostock-audit.jsonl
      BAOSTOCK_USER_ID: ${BAOSTOCK_USER_ID}
      BAOSTOCK_PASSWORD: ${BAOSTOCK_PASSWORD}
      BAOSTOCK_MCP_TRANSPORT: streamable-http
      BAOSTOCK_MCP_HOST: 0.0.0.0
      BAOSTOCK_MCP_PORT: "8000"
      BAOSTOCK_MCP_PATH: /mcp
      BAOSTOCK_HTTP_TOKEN: ${BAOSTOCK_HTTP_TOKEN:-}
      BAOSTOCK_HTTP_DEV_MODE: ${BAOSTOCK_HTTP_DEV_MODE:-false}
      # True = stateless Streamable HTTP. Avoids "Session not found" 404 disconnects
      # when the client reconnects after the stateful session idle timeout.
      BAOSTOCK_MCP_STATELESS: ${BAOSTOCK_MCP_STATELESS:-true}
      BAOSTOCK_MIN_INTERVAL_SECONDS: "1.0"
      BAOSTOCK_DAILY_WARNING_LIMIT: "10000"
      BAOSTOCK_DAILY_HARD_LIMIT: "20000"
      BAOSTOCK_MAX_RETRIES: "2"
      BAOSTOCK_RETRY_DELAYS_SECONDS: "5,30,120"
      # B-02: bounded queue, deadlines and bounded background starvation
      BAOSTOCK_REQUEST_QUEUE_CAPACITY: ${BAOSTOCK_REQUEST_QUEUE_CAPACITY:-256}
      BAOSTOCK_FOREGROUND_DEADLINE_SECONDS: ${BAOSTOCK_FOREGROUND_DEADLINE_SECONDS:-120}
      BAOSTOCK_BACKGROUND_DEADLINE_SECONDS: ${BAOSTOCK_BACKGROUND_DEADLINE_SECONDS:-300}
      BAOSTOCK_BACKGROUND_FAIRNESS_WAIT_SECONDS: ${BAOSTOCK_BACKGROUND_FAIRNESS_WAIT_SECONDS:-60}
      BAOSTOCK_BACKGROUND_FAIRNESS_FOREGROUND_BURST: ${BAOSTOCK_BACKGROUND_FAIRNESS_FOREGROUND_BURST:-10}
      BAOSTOCK_AUDIT_LOG_MAX_BYTES: ${BAOSTOCK_AUDIT_LOG_MAX_BYTES:-20971520}
      # A-04: parameter cache TTL (seconds)
      BAOSTOCK_CACHE_TTL_EMPTY_SECONDS: ${BAOSTOCK_CACHE_TTL_EMPTY_SECONDS:-900}
      BAOSTOCK_CACHE_TTL_RECENT_QUOTES_SECONDS: ${BAOSTOCK_CACHE_TTL_RECENT_QUOTES_SECONDS:-900}
      BAOSTOCK_CACHE_TTL_HISTORICAL_QUOTES_SECONDS: ${BAOSTOCK_CACHE_TTL_HISTORICAL_QUOTES_SECONDS:-604800}
      BAOSTOCK_CACHE_TTL_FINANCIAL_SECONDS: ${BAOSTOCK_CACHE_TTL_FINANCIAL_SECONDS:-86400}
      BAOSTOCK_CACHE_TTL_BASIC_SECONDS: ${BAOSTOCK_CACHE_TTL_BASIC_SECONDS:-604800}
      BAOSTOCK_CACHE_TTL_DEFAULT_SECONDS: ${BAOSTOCK_CACHE_TTL_DEFAULT_SECONDS:-86400}
      BAOSTOCK_CACHE_RECENT_QUOTES_WINDOW_DAYS: ${BAOSTOCK_CACHE_RECENT_QUOTES_WINDOW_DAYS:-5}
      # C-02: daily main collection mode (per_stock default; daily_batch requires EXT-02 validation)
      BAOSTOCK_FETCH_MODE: ${BAOSTOCK_FETCH_MODE:-per_stock}
      BAOSTOCK_DAILY_BATCH_FALLBACK: ${BAOSTOCK_DAILY_BATCH_FALLBACK:-true}
      BAOSTOCK_DAILY_BATCH_WINDOW_DAYS: ${BAOSTOCK_DAILY_BATCH_WINDOW_DAYS:-7}
      BAOSTOCK_DAILY_BATCH_MIN_ROWS: ${BAOSTOCK_DAILY_BATCH_MIN_ROWS:-500}
      # Session keepalive / reconnect
      BAOSTOCK_SESSION_IDLE_TIMEOUT_SECONDS: ${BAOSTOCK_SESSION_IDLE_TIMEOUT_SECONDS:-1800}
      BAOSTOCK_RECONNECT_ON_FAILURE: ${BAOSTOCK_RECONNECT_ON_FAILURE:-true}
      BAOSTOCK_VERIFY_AFTER_LOGIN: ${BAOSTOCK_VERIFY_AFTER_LOGIN:-true}
      # Background fetcher (P1): batch download to local SQLite
      BAOSTOCK_FETCH_ENABLED: ${BAOSTOCK_FETCH_ENABLED:-true}
      BAOSTOCK_FETCH_UNIVERSE: ${BAOSTOCK_FETCH_UNIVERSE:-hs300}
      BAOSTOCK_FETCH_BUDGET_RATIO: ${BAOSTOCK_FETCH_BUDGET_RATIO:-0.67}
      BAOSTOCK_FETCH_BATCH_SIZE: ${BAOSTOCK_FETCH_BATCH_SIZE:-50}
      BAOSTOCK_FETCH_DAILY_START_DATE: ${BAOSTOCK_FETCH_DAILY_START_DATE:-2018-01-01}
      BAOSTOCK_FETCH_FINANCIAL_START_YEAR: ${BAOSTOCK_FETCH_FINANCIAL_START_YEAR:-2022}
      BAOSTOCK_FETCH_FINANCIAL_DATASETS: ${BAOSTOCK_FETCH_FINANCIAL_DATASETS:-profit}
      BAOSTOCK_FETCH_ADJUSTFLAGS: ${BAOSTOCK_FETCH_ADJUSTFLAGS:-3}
      BAOSTOCK_FETCH_INCLUDE_DIVIDENDS: ${BAOSTOCK_FETCH_INCLUDE_DIVIDENDS:-false}
      BAOSTOCK_FETCH_INCLUDE_ADJUST_FACTORS: ${BAOSTOCK_FETCH_INCLUDE_ADJUST_FACTORS:-false}
      BAOSTOCK_FETCH_IDLE_SLEEP_SECONDS: ${BAOSTOCK_FETCH_IDLE_SLEEP_SECONDS:-300}
      BAOSTOCK_FETCH_PAUSE_SLEEP_SECONDS: ${BAOSTOCK_FETCH_PAUSE_SLEEP_SECONDS:-600}
      # A-01: 统一时间与日历推进（业务日 Asia/Shanghai、审计 UTC，代码内置）
      BAOSTOCK_DAILY_CHECK_TIME: ${BAOSTOCK_DAILY_CHECK_TIME:-18:00}
      BAOSTOCK_CALENDAR_PRELOOK_DAYS: ${BAOSTOCK_CALENDAR_PRELOOK_DAYS:-0}
      # A-03: 可重查任务与财务修订
      BAOSTOCK_FINANCIAL_WAITING_RETRY_HOURS: ${BAOSTOCK_FINANCIAL_WAITING_RETRY_HOURS:-24}
      BAOSTOCK_FINANCIAL_REVISION_CHECK_DAYS: ${BAOSTOCK_FINANCIAL_REVISION_CHECK_DAYS:-1}
      BAOSTOCK_FINANCIAL_REVISION_CHECK_DAYS_FULL: ${BAOSTOCK_FINANCIAL_REVISION_CHECK_DAYS_FULL:-30}
      BAOSTOCK_TASK_LEASE_SECONDS: ${BAOSTOCK_TASK_LEASE_SECONDS:-600}
      BAOSTOCK_TASK_RETRY_BASE_SECONDS: ${BAOSTOCK_TASK_RETRY_BASE_SECONDS:-60}
      BAOSTOCK_TASK_RETRY_MAX_SECONDS: ${BAOSTOCK_TASK_RETRY_MAX_SECONDS:-3600}
      # Worker heartbeat watchdog: self-heal when the gateway worker dead-loops
      # (baostock rs.next() half-open spin) - kill the process so the container
      # restart policy recreates it. Normal queries refresh the heartbeat.
      BAOSTOCK_WATCHDOG_ENABLED: ${BAOSTOCK_WATCHDOG_ENABLED:-true}
      BAOSTOCK_WATCHDOG_TIMEOUT_SECONDS: ${BAOSTOCK_WATCHDOG_TIMEOUT_SECONDS:-300}
      BAOSTOCK_WATCHDOG_CHECK_INTERVAL_SECONDS: ${BAOSTOCK_WATCHDOG_CHECK_INTERVAL_SECONDS:-15}
      BAOSTOCK_MAX_RESULT_ROWS: ${BAOSTOCK_MAX_RESULT_ROWS:-50000}
      # Offline mode: no network/credentials needed (dev / MCP line testing)
      BAOSTOCK_OFFLINE: ${BAOSTOCK_OFFLINE:-false}
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 8000), 3); s.close()"]
      interval: 300s
      timeout: 10s
      retries: 3
      start_period: 20s
networks:
  lobehub_lobe-net:
    external: true
