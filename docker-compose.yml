services:
  baostock-runner:
    build:
      context: .
      args:
        HTTP_PROXY: ${BAOSTOCK_BUILD_HTTP_PROXY}
        HTTPS_PROXY: ${BAOSTOCK_BUILD_HTTPS_PROXY}
        NO_PROXY: ${BAOSTOCK_BUILD_NO_PROXY}
    image: ghcr.io/nickshee/baostock-runner:latest
    container_name: baostock-runner
    restart: unless-stopped
    ports:
      - "8002:8000"
    volumes:
      - ${BAOSTOCK_HOST_DATA_DIR}:/data
    networks:
      - lobehub_lobe-net
    environment:
      BAOSTOCK_DB_PATH: /data/baostock.sqlite3
      BAOSTOCK_LOG_PATH: /data/baostock-audit.jsonl
      BAOSTOCK_USER_ID: ${BAOSTOCK_USER_ID}
      BAOSTOCK_PASSWORD: ${BAOSTOCK_PASSWORD}
      BAOSTOCK_MCP_TRANSPORT: streamable-http
      BAOSTOCK_MCP_HOST: 0.0.0.0
      BAOSTOCK_MCP_PORT: "8000"
      BAOSTOCK_MCP_PATH: /mcp
      # True = stateless Streamable HTTP. Avoids "Session not found" 404 disconnects
      # when the client reconnects after the stateful session idle timeout.
      BAOSTOCK_MCP_STATELESS: ${BAOSTOCK_MCP_STATELESS:-true}
      BAOSTOCK_MIN_INTERVAL_SECONDS: "1.0"
      BAOSTOCK_DAILY_WARNING_LIMIT: "10000"
      BAOSTOCK_DAILY_HARD_LIMIT: "20000"
      BAOSTOCK_MAX_RETRIES: "2"
networks:
  lobehub_lobe-net:
    external: true
